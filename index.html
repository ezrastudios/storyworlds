<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story Worlds Composer</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <p class="eyebrow">Ezra Studios</p>
      <h1>Story Worlds Composer</h1>
      <p class="intro">Construye escenarios por capas para Flow, referencias narrativas y fondos con parallax.</p>

      <section class="panel">
        <h2>Agregar imágenes</h2>
        <label class="file-button">
          Cargar PNG / JPG / WebP / SVG
          <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" multiple />
        </label>
        <div class="button-row">
          <button id="addDemoBtn" type="button">Demo</button>
          <button id="clearBtn" type="button">Limpiar</button>
        </div>
      </section>

      <section class="panel">
        <h2>Capas</h2>
        <ol id="layerList" class="layer-list"></ol>
      </section>

      <section class="panel inspector">
        <h2>Inspector</h2>
        <label>Nombre <input id="nameInput" type="text" /></label>
        <label>Tipo
          <select id="typeInput">
            <option value="background">Background</option>
            <option value="architecture">Architecture</option>
            <option value="furniture">Furniture</option>
            <option value="decor">Decor</option>
            <option value="foreground">Foreground</option>
          </select>
        </label>
        <label>Escala <input id="scaleInput" type="range" min="0.1" max="3" step="0.01" /></label>
        <label>Rotación <input id="rotationInput" type="range" min="-45" max="45" step="1" /></label>
        <label>Opacidad <input id="opacityInput" type="range" min="0" max="1" step="0.01" /></label>
        <label>Blur <input id="blurInput" type="range" min="0" max="20" step="0.5" /></label>
        <label>Profundidad <input id="depthInput" type="range" min="0" max="1" step="0.01" /></label>
        <div class="button-row">
          <button id="sendBackBtn" type="button">Atrás</button>
          <button id="bringFrontBtn" type="button">Frente</button>
          <button id="deleteBtn" type="button">Borrar</button>
        </div>
      </section>

      <section class="panel">
        <h2>Exportar</h2>
        <div class="button-row">
          <button id="exportPngBtn" type="button">PNG</button>
          <button id="exportJsonBtn" type="button">JSON</button>
        </div>
      </section>
    </aside>

    <section class="stage-wrap">
      <header class="stage-toolbar">
        <span>Canvas 4:5</span>
        <label class="toggle"><input id="parallaxToggle" type="checkbox" /> Preview parallax</label>
      </header>
      <div id="stageShell" class="stage-shell">
        <canvas id="sceneCanvas" width="1600" height="2000" aria-label="Lienzo del escenario"></canvas>
      </div>
      <p class="hint">Arrastra una capa sobre el lienzo. Usa el inspector para profundidad, blur y escala.</p>
    </section>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
