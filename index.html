<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Story Worlds</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <main id="app" data-mode="explore" data-brush-lock="off">
    <section id="viewport" aria-label="Lienzo 3D de Story Worlds"></section>

    <header class="topbar ui-layer">
      <div>
        <p class="eyebrow">Ezra Studios</p>
        <h1>Story Worlds</h1>
      </div>
      <div class="top-actions">
        <button id="modeBtn" class="pill-btn primary" type="button">Explorar</button>
        <button id="seedBtn" class="pill-btn" type="button">Nuevo seed</button>
        <button id="resetBtn" class="pill-btn" type="button">Reiniciar</button>
      </div>
    </header>

    <aside id="toolsPanel" class="panel tools-panel ui-layer" aria-label="Herramientas de edición">
      <button class="tool active" data-tool="grass" type="button" title="Spray bajo: pasto, flores y plantas pequeñas">🌿</button>
      <button class="tool" data-tool="forest" type="button" title="Árboles por bioma">🌳</button>
      <button class="tool" data-tool="water" type="button" title="Agua">🌊</button>
      <button class="tool" data-tool="waterfall" type="button" title="Caída de agua sutil">💧</button>
      <button class="tool" data-tool="stone" type="button" title="Roca">🪨</button>
      <button class="tool" data-tool="raise" type="button" title="Elevar / Montaña">⛰️</button>
      <button class="tool" data-tool="lower" type="button" title="Bajar / Cañón">🕳️</button>
      <button class="tool" data-tool="smooth" type="button" title="Suavizar">🪄</button>
      <button class="tool" data-tool="flatten" type="button" title="Aplanar">▭</button>
      <button class="tool" data-tool="erase" type="button" title="Borrar">⌫</button>
    </aside>

    <aside id="editPanel" class="panel edit-panel ui-layer">
      <button id="undoBtn" class="mini-btn" type="button">↶</button>
      <button id="redoBtn" class="mini-btn" type="button">↷</button>
      <button id="brushLockBtn" class="wide-btn" type="button">Pincel: toque</button>
      <div class="brush-size" aria-label="Tamaño del pincel">
        <button class="size-btn" data-size="small" type="button">S</button>
        <button class="size-btn active" data-size="medium" type="button">M</button>
        <button class="size-btn" data-size="large" type="button">L</button>
      </div>
      <select id="densitySelect" class="density-select" aria-label="Densidad de decoración">
        <option value="low">Pocas</option>
        <option value="normal" selected>Normal</option>
        <option value="high">Muchas</option>
      </select>
      <label class="time-control" aria-label="Hora del día">☀️<input id="timeSlider" type="range" min="0" max="1" value="0.28" step="0.01" />🌙</label>
      <span id="modeHint">Arrastra para mover cámara</span>
    </aside>

    <aside id="infoPanel" class="panel info-panel ui-layer">
      <strong>v0.7.3</strong>
      <span>Seeds más imperfectos, spray separado de árboles, vegetación baja y cascadas discretas.</span>
    </aside>

    <nav class="quickbar">
      <button id="hideUiBtn" class="round-btn" type="button" aria-label="Ocultar interfaz">👁️</button>
      <button id="helpBtn" class="round-btn ui-layer" type="button" aria-label="Ayuda">?</button>
    </nav>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
